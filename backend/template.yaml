AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: ClubOS backend

Globals:
  Function:
    Runtime: python3.13
    Timeout: 10
    MemorySize: 128
    Environment:
      Variables:
        COLLEGE_ID: demo-college

Resources:
  UserPool:
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "${AWS::StackName}-users"
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: false

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      PreventUserExistenceErrors: ENABLED
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH

  StudentGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: student
      UserPoolId: !Ref UserPool

  CollegeAdminGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: college_admin
      UserPoolId: !Ref UserPool

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins: ["*"]
        AllowHeaders: ["*"]
        AllowMethods: ["*"]
      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        Authorizers:
          CognitoAuthorizer:
            IdentitySource: $request.header.Authorization
            JwtConfiguration:
              issuer: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}"
              audience:
                - !Ref UserPoolClient

  HelloFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/hello/
      Handler: app.handler
      Events:
        Hello:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /hello
            Method: GET
            Auth:
              Authorizer: NONE

  MeFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/me/
      Handler: app.handler
      Events:
        Me:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /me
            Method: GET

  ClubsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: collegeId
          AttributeType: S
        - AttributeName: clubId
          AttributeType: S
      KeySchema:
        - AttributeName: collegeId
          KeyType: HASH
        - AttributeName: clubId
          KeyType: RANGE

  ClubsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/clubs/
      Handler: app.handler
      Environment:
        Variables:
          TABLE_NAME: !Ref ClubsTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ClubsTable
      Events:
        CreateClub:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /clubs
            Method: POST
        ListClubs:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /clubs
            Method: GET
        GetClub:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /clubs/{clubId}
            Method: GET

Outputs:
  ApiUrl:
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com"
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref UserPoolClient
  ClubsTableName:
    Value: !Ref ClubsTable