AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: ClubOS backend

Globals:
  Function:
    Runtime: python3.13
    Timeout: 10
    MemorySize: 128
    Environment:
      Variables:
        COLLEGE_ID: demo-college

Resources:
  UserPool:
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub ${AWS::StackName}-users
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: false

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      PreventUserExistenceErrors: ENABLED
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH

  StudentGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: student
      UserPoolId: !Ref UserPool

  CollegeAdminGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: college_admin
      UserPoolId: !Ref UserPool

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins:
          - http://localhost:5173
          - http://clubos-frontend-218485539084.s3-website.ap-south-1.amazonaws.com
        AllowMethods:
          - GET
          - POST
          - PATCH
          - DELETE
          - OPTIONS
        AllowHeaders:
          - Authorization
          - Content-Type
        MaxAge: 600
      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        Authorizers:
          CognitoAuthorizer:
            IdentitySource: $request.header.Authorization
            JwtConfiguration:
              issuer: !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}
              audience:
                - !Ref UserPoolClient

  HelloFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/hello/
      Handler: app.handler
      Events:
        Hello:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /hello
            Method: GET
            Auth:
              Authorizer: NONE

  MeFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/me/
      Handler: app.handler
      Events:
        Me:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /me
            Method: GET

  ClubsTable:
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: collegeId
          AttributeType: S
        - AttributeName: clubId
          AttributeType: S
      KeySchema:
        - AttributeName: collegeId
          KeyType: HASH
        - AttributeName: clubId
          KeyType: RANGE

  ClubsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/clubs/
      Handler: app.handler
      Environment:
        Variables:
          TABLE_NAME: !Ref ClubsTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ClubsTable
      Events:
        CreateClub:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /clubs
            Method: POST
        ListClubs:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /clubs
            Method: GET
        GetClub:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /clubs/{clubId}
            Method: GET

  MembershipsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: clubId
          AttributeType: S
        - AttributeName: userId
          AttributeType: S
      KeySchema:
        - AttributeName: clubId
          KeyType: HASH
        - AttributeName: userId
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: UserClubsIndex
          KeySchema:
            - AttributeName: userId
              KeyType: HASH
            - AttributeName: clubId
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  MembershipsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/memberships/
      Handler: app.handler
      Environment:
        Variables:
          MEMBERSHIPS_TABLE: !Ref MembershipsTable
          CLUBS_TABLE: !Ref ClubsTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref MembershipsTable
        - DynamoDBReadPolicy:
            TableName: !Ref ClubsTable
      Events:
        JoinClub:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /clubs/{clubId}/join
            Method: POST
        ListMembers:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /clubs/{clubId}/members
            Method: GET
        UpdateMember:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /clubs/{clubId}/members/{userId}
            Method: PATCH
        MyMemberships:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /me/memberships
            Method: GET

  EventsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: clubId
          AttributeType: S
        - AttributeName: eventId
          AttributeType: S
      KeySchema:
        - AttributeName: clubId
          KeyType: HASH
        - AttributeName: eventId
          KeyType: RANGE

  RegistrationsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: eventId
          AttributeType: S
        - AttributeName: userId
          AttributeType: S
        - AttributeName: ticketId
          AttributeType: S
      KeySchema:
        - AttributeName: eventId
          KeyType: HASH
        - AttributeName: userId
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: UserRegistrationsIndex
          KeySchema:
            - AttributeName: userId
              KeyType: HASH
            - AttributeName: eventId
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: TicketIndex
          KeySchema:
            - AttributeName: ticketId
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  EventsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/events/
      Handler: app.lambda_handler
      Environment:
        Variables:
          EVENTS_TABLE: !Ref EventsTable
          REGISTRATIONS_TABLE: !Ref RegistrationsTable
          CLUBS_TABLE: !Ref ClubsTable
          MEMBERSHIPS_TABLE: !Ref MembershipsTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref EventsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref RegistrationsTable
        - DynamoDBReadPolicy:
            TableName: !Ref ClubsTable
        - DynamoDBReadPolicy:
            TableName: !Ref MembershipsTable
      Events:
        CreateEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /clubs/{clubId}/events
            Method: POST
        ListEvents:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /clubs/{clubId}/events
            Method: GET
        GetEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /clubs/{clubId}/events/{eventId}
            Method: GET
        Register:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /clubs/{clubId}/events/{eventId}/register
            Method: POST
        CancelRegistration:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /clubs/{clubId}/events/{eventId}/register
            Method: DELETE
        MyRegistrations:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /me/registrations
            Method: GET

  CheckinFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/checkin/
      Handler: app.lambda_handler
      Environment:
        Variables:
          EVENTS_TABLE: !Ref EventsTable
          REGISTRATIONS_TABLE: !Ref RegistrationsTable
          MEMBERSHIPS_TABLE: !Ref MembershipsTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref RegistrationsTable
        - DynamoDBReadPolicy:
            TableName: !Ref EventsTable
        - DynamoDBReadPolicy:
            TableName: !Ref MembershipsTable
      Events:
        GetTicket:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /clubs/{clubId}/events/{eventId}/ticket
            Method: GET
        CheckIn:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /clubs/{clubId}/events/{eventId}/checkin
            Method: POST
        Attendance:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /clubs/{clubId}/events/{eventId}/attendance
            Method: GET

Outputs:
  ApiUrl:
    Value: !Sub https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref UserPoolClient
  ClubsTableName:
    Value: !Ref ClubsTable
  MembershipsTableName:
    Value: !Ref MembershipsTable